name: Build PCVR plugin

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/**"
      - "CompCube/**"
      - "CompCube.sln"
  pull_request:
    paths:
      - ".github/**"
      - "CompCube/**"
      - "CompCube.sln"

permissions:
  contents: read

concurrency:
  group: pcvr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Beat Saber ${{ matrix.game-version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        game-version:
          - 1.39.1
          - 1.40.8

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Acquire stripped Beat Saber references
        uses: beat-forge/init-beatsaber@v1
        with:
          token: ${{ github.token }}
          version: ${{ matrix.game-version }}
          path: ${{ github.workspace }}/Refs

      - name: Acquire mod references
        shell: pwsh
        run: |
          $gameVersion = "${{ matrix.game-version }}"
          $manifest = Get-Content ".github/manifests/$gameVersion.json" -Raw | ConvertFrom-Json
          $response = Invoke-RestMethod -Uri "https://beatmods.com/api/mods?gameVersion=$gameVersion&status=verified"

          foreach ($name in $manifest.dependsOn.PSObject.Properties.Name) {
            $entry = $response.mods | Where-Object { $_.mod.name -eq $name } | Select-Object -First 1
            if ($null -eq $entry) {
              throw "No verified version of '$name' exists on BeatMods for Beat Saber $gameVersion."
            }

            $archive = Join-Path $env:RUNNER_TEMP "$name.zip"
            Write-Output "Downloading $name $($entry.latest.modVersion)..."
            Invoke-WebRequest -Uri "https://beatmods.com/cdn/mod/$($entry.latest.zipHash).zip" -OutFile $archive
            Expand-Archive -LiteralPath $archive -DestinationPath "${{ github.workspace }}/Refs" -Force
          }

      - name: Build plugin
        env:
          FrameworkPathOverride: /usr/lib/mono/4.8-api
        run: >-
          dotnet build CompCube.sln
          --configuration Release
          -p:GameVersion=${{ matrix.game-version }}
          -p:LocalRefsDir=${{ github.workspace }}/Refs
          -p:BeatSaberDir=${{ github.workspace }}/Refs
          -p:ContinuousIntegrationBuild=False
          -p:DisableCopyToPlugins=True
          -p:DisableZipRelease=True

      - name: Stage DLL
        id: stage
        shell: pwsh
        run: |
          $dll = Get-ChildItem "CompCube/bin/Release" -Recurse -Filter "CompCube.dll" | Select-Object -First 1
          if ($null -eq $dll) {
            throw "CompCube.dll was not produced."
          }

          New-Item -ItemType Directory -Path "artifact" -Force | Out-Null
          Copy-Item $dll.FullName "artifact/CompCube-bs${{ matrix.game-version }}.dll"
          [xml]$props = Get-Content "CompCube/Directory.Build.props"
          $pluginVersion = $props.Project.PropertyGroup.Version | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($pluginVersion)) {
            throw "Plugin version is missing from Directory.Build.props."
          }
          "plugin-version=$pluginVersion" >> $env:GITHUB_OUTPUT

      - name: Upload DLL
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref == 'refs/heads/main' && format('CompCube-bs{0}', matrix.game-version) || format('CompCube-development-bs{0}-run-{1}-attempt-{2}', matrix.game-version, github.run_number, github.run_attempt) }}
          path: artifact/CompCube-bs${{ matrix.game-version }}.dll
          if-no-files-found: error
          retention-days: 30

      - name: Publish DLL to CompCube server
        # Production publishing is deliberately branch-gated. Pushes, pull requests,
        # and manual runs from every other ref remain available only as Actions artifacts.
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          COMPCUBE_UPLOAD_URL: ${{ secrets.COMPCUBE_UPLOAD_URL }}
          COMPCUBE_UPLOAD_TOKEN: ${{ secrets.COMPCUBE_UPLOAD_TOKEN }}
          PLUGIN_VERSION: ${{ steps.stage.outputs.plugin-version }}
          GAME_VERSION: ${{ matrix.game-version }}
        run: |
          if [[ -z "$COMPCUBE_UPLOAD_URL" || -z "$COMPCUBE_UPLOAD_TOKEN" ]]; then
            echo "CompCube upload secrets are not configured; keeping the Actions artifact only."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $COMPCUBE_UPLOAD_TOKEN" \
            --header "Content-Type: application/octet-stream" \
            --header "X-CompCube-Plugin-Version: $PLUGIN_VERSION" \
            --data-binary "@artifact/CompCube-bs${GAME_VERSION}.dll" \
            "${COMPCUBE_UPLOAD_URL%/}/internal/plugin-releases/$GAME_VERSION"
